# Category lists, one block per vertical.
#
# The point of this file is the nuance the post calls out: a business hides
# under more categories than the obvious one.  A funeral home is also a
# "memorial park", a "cremation service" and a "mortuary" -- search only
# "funeral home" and you leave half the market on the table.
#
# Each block has:
#   icp        one sentence describing who you actually want. This is fed
#              verbatim to the local model in the `classify` stage, so write it
#              the way you would brief a teammate -- include the exclusions.
#   categories the Google Maps category strings to search, one request each.
#
# Cost is linear in the number of categories:
#   requests = zips x categories.  With the default STANDARD-only ZIP list
#   (~29.8k) a 20-category vertical is ~596k requests, about $20 at
#   $100 / 3M requests.  Run `estimate` before a big run.
#
# Add your own block and pass `--vertical <name>`.

funeral:
  icp: >
    An independently owned funeral home, mortuary, crematory or cemetery that
    serves families directly. Exclude casket/urn e-commerce stores, headstone
    manufacturers, life-insurance and pre-need insurance agencies, hospices,
    estate lawyers, and pet cremation services.
  categories:
    - funeral home
    - funeral director
    - mortuary
    - cremation service
    - crematorium
    - memorial park
    - cemetery
    - funeral home and cremation service
    - burial service
    - casket service
    - memorial service
    - chapel of rest

hvac:
  icp: >
    A residential or light-commercial HVAC contractor that installs and
    services heating, cooling or ventilation equipment. Exclude equipment
    manufacturers, parts wholesalers and distributors, big-box retailers, and
    pure-play duct-cleaning franchises.
  categories:
    - hvac contractor
    - heating contractor
    - air conditioning contractor
    - air conditioning repair service
    - furnace repair service
    - heating equipment supplier
    - air conditioning system supplier
    - ventilating equipment manufacturer
    - refrigeration service
    - boiler supplier
    - heat pump supplier
    - duct cleaning service
    - hvac repair service
    - air duct cleaning service

